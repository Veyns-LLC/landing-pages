# Explicit build settings — do not rely on Netlify's framework auto-detection.
[build]
  command = "npm run build"
  publish  = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# The waitlist form posts to /api/subscribe. Map it onto the function.
# Must come BEFORE the SPA fallback below — Netlify applies redirects in order.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# The affiliate landing page is a second Vite entry, built to
# dist/affiliate/index.html. Netlify resolves that for /affiliate by itself;
# these rewrites are a guard so the SPA fallback below can never answer an
# affiliate URL with the waiting-list page. They are rewrites, not redirects,
# so the visible URL stays /affiliate.
[[redirects]]
  from = "/affiliate"
  to = "/affiliate/index.html"
  status = 200

[[redirects]]
  from = "/affiliate/*"
  to = "/affiliate/index.html"
  status = 200

# The repo name and early links spell it "affilate".
[[redirects]]
  from = "/affilate"
  to = "/affiliate"
  status = 301

[[redirects]]
  from = "/affilate/*"
  to = "/affiliate"
  status = 301

# SPA fallback for any non-asset path.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
